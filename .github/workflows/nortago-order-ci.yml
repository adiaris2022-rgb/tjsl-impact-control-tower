name: NORTAGO Order CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: nortago-order-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run Owner Inbox cursor pagination unit tests
        run: node --test app/otc/owner/inbox-pagination.test.mjs
      - name: Run Owner summary cursor pagination unit tests
        run: node --test app/otc/owner/summary-pagination.test.mjs
      - name: Run Owner hourly report pagination and aggregation tests
        run: node --test app/otc/owner-report/hourly-summary.test.mjs
      - name: Production build
        run: npm run build

  database-migrations:
    name: Validate PostgreSQL migrations and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nortago_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nortago_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Create minimal existing TJSL schema contracts
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pgcrypto;
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin;
          create role nortago_order_status_writer_ci nologin inherit;
          create schema auth;
          create function auth.uid() returns uuid language sql stable as $$ select '00000000-0000-0000-0000-000000000001'::uuid $$;
          create table public.businesses (id uuid primary key default gen_random_uuid());
          create table public.business_users (
            id uuid primary key default gen_random_uuid(),
            business_id uuid not null references public.businesses(id),
            user_id uuid not null,
            role text not null,
            created_at timestamptz not null default now()
          );
          create index business_users_ci_membership_idx on public.business_users(business_id, user_id, role);
          create table public.tjsl_partners (id uuid primary key default gen_random_uuid());
          create function public.has_business_role(p_business_id uuid, p_roles text[])
          returns boolean language sql stable security definer
          set search_path = pg_catalog, public, pg_temp as $membership$
            select exists (
              select 1 from public.business_users bu
              where bu.business_id = p_business_id
                and bu.user_id = auth.uid()
                and bu.role = any(p_roles)
            )
          $membership$;
          grant execute on function public.has_business_role(uuid, text[]) to authenticated;
          SQL
      - name: Apply existing OTC commerce schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20260928_otc_commerce_core_v1.sql
      - name: Apply Product and Service catalog schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261121_nortago_order_services_catalog_v1.sql
      - name: Replay Product and Service catalog schema (idempotency)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261121_nortago_order_services_catalog_v1.sql
      - name: Apply atomic catalog creation RPC
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261121_nortago_order_catalog_create_rpc_v1.sql
      - name: Replay atomic catalog creation RPC (idempotency)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261121_nortago_order_catalog_create_rpc_v1.sql
      - name: Run atomic catalog creation RPC security smoke checks
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/tests/nortago_order_catalog_create_rpc_smoke.sql
      - name: Simulate Supabase client DML grants before release hardening
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 <<'SQL'
          grant select, insert, update, delete on public.otc_orders, public.otc_order_items to anon, authenticated;
          grant insert (status), update (status) on public.otc_orders to anon, authenticated;
          grant insert (quantity), update (quantity) on public.otc_order_items to anon, authenticated;
          SQL
      - name: Apply NORTAGO subscription schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261117_nortago_order_subscription_engine_v1.sql
      - name: Apply subscription billing schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261117_nortago_order_subscription_billing_v1.sql
      - name: Apply secure customer checkout schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261117_nortago_customer_checkout_secure_v1.sql
      - name: Apply customer reservation schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261117_nortago_customer_reservation_v1.sql
      - name: Apply reservation management schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261117_nortago_reservation_management_v1.sql
      - name: Apply NORTAGO Order-only scope lock
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261120_nortago_order_only_scope_lock_v1.sql
      - name: Replay NORTAGO Order-only scope lock (idempotency)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261120_nortago_order_only_scope_lock_v1.sql
      - name: Apply subscription plan snapshot migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261120_nortago_order_subscription_plan_snapshot_v1.sql
      - name: Replay subscription plan snapshot migration (idempotency)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261120_nortago_order_subscription_plan_snapshot_v1.sql
      - name: Apply customer checkout idempotency migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261120_nortago_customer_checkout_idempotency_v1.sql
      - name: Replay customer checkout idempotency migration (idempotency)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261120_nortago_customer_checkout_idempotency_v1.sql
      - name: Run Product and Service catalog checkout-to-receipt smoke checks
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/tests/nortago_order_services_catalog_smoke.sql
      - name: Apply order lifecycle RPC and audit schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261120_nortago_order_lifecycle_rpc_v1.sql
      - name: Replay order lifecycle RPC migration (idempotency)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261120_nortago_order_lifecycle_rpc_v1.sql
      - name: Apply Order-only release scope guard
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261120_nortago_order_release_scope_guard_v1.sql
      - name: Replay Order-only release scope guard (idempotency)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261120_nortago_order_release_scope_guard_v1.sql
      - name: Apply NORTAGO Order POS-integrated source guard
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261122_nortago_order_pos_integrated_scope_guard_v1.sql
      - name: Replay NORTAGO Order POS-integrated source guard (idempotency)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261122_nortago_order_pos_integrated_scope_guard_v1.sql
      - name: Prove pre-hardening direct status bypass in disposable CI
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/tests/nortago_order_status_direct_write_baseline_smoke.sql
      - name: Apply RPC-only order and item write privileges
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261121_nortago_order_rpc_only_write_privileges_v1.sql
      - name: Replay RPC-only order and item write privileges (idempotency)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261121_nortago_order_rpc_only_write_privileges_v1.sql
      - name: Apply order status RPC owner guard
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261123_nortago_order_status_rpc_owner_guard_v1.sql
      - name: Replay order status RPC owner guard (idempotency)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261123_nortago_order_status_rpc_owner_guard_v1.sql
      - name: Run subscription billing security smoke checks
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/tests/nortago_subscription_billing_smoke.sql
      - name: Run per-outlet subscription billing functional smoke checks
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/tests/nortago_subscription_per_outlet_smoke.sql
      - name: Run schema and transactional RPC smoke checks
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/tests/nortago_subscription_schema_smoke.sql
      - name: Run order lifecycle RPC security smoke checks
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/tests/nortago_order_lifecycle_rpc_smoke.sql
      - name: Run RPC-only order mutation privilege smoke checks
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/tests/nortago_order_rpc_only_write_privileges_smoke.sql
      - name: Apply dedicated lifecycle RPC owner migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261124_nortago_order_dedicated_lifecycle_owner_v1.sql
      - name: Replay dedicated lifecycle RPC owner migration (idempotency)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261124_nortago_order_dedicated_lifecycle_owner_v1.sql
      - name: Verify dedicated lifecycle owner minimal grants and RLS
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/tests/nortago_order_lifecycle_dedicated_owner_smoke.sql
      - name: Run inherited status privilege RPC owner guard smoke checks
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/tests/nortago_order_status_rpc_owner_guard_smoke.sql
      - name: Run same-owner SECURITY DEFINER status-writer inventory smoke checks
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/tests/nortago_order_status_writer_owner_inventory_smoke.sql
      - name: Run order lifecycle audit RLS smoke checks
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/tests/nortago_order_lifecycle_audit_rls_smoke.sql
      - name: Run order lifecycle audit append-only privilege smoke checks
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/tests/nortago_order_audit_append_only_privileges_smoke.sql
      - name: Run order lifecycle edge-transition smoke checks
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/tests/nortago_order_lifecycle_edge_transitions_smoke.sql
      - name: Run paid-order lifecycle smoke checks
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/tests/nortago_order_lifecycle_paid_order_smoke.sql
      - name: Run Order-only scope smoke checks
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/tests/nortago_order_scope_smoke.sql
      - name: Run customer checkout idempotency smoke checks
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/tests/nortago_customer_checkout_idempotency_smoke.sql
      - name: Run customer checkout tenant-isolation smoke checks
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/tests/nortago_customer_checkout_tenant_isolation_smoke.sql
      - name: Execute read-only staging security audit SQL against disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -X -q -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f docs/NORTAGO_ORDER_STAGING_SECURITY_AUDIT.sql > /tmp/nortago-order-staging-security-audit.log
          echo "Read-only staging catalog audit SQL executed successfully against disposable CI PostgreSQL."
