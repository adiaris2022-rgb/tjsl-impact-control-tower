name: NORTAGO Order CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: nortago-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build

  database-migrations:
    name: PostgreSQL migrations and BOS security smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nortago_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nortago_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      ${steps.join("
      ")}
