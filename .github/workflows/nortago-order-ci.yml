name: NORTAGO Order CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: nortago-order-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build

  database-migrations:
    name: Validate PostgreSQL migrations and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nortago_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nortago_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Create minimal existing TJSL schema contracts
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pgcrypto;
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin;
          create table public.businesses (id uuid primary key default gen_random_uuid());
          create table public.tjsl_partners (id uuid primary key default gen_random_uuid());
          create function public.has_business_role(p_business_id uuid, p_roles text[])
          returns boolean language sql stable as $$ select false $$;
          SQL
      - name: Apply existing OTC commerce schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20260928_otc_commerce_core_v1.sql
      - name: Apply NORTAGO subscription schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261117_nortago_order_subscription_engine_v1.sql
      - name: Apply subscription billing schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261117_nortago_order_subscription_billing_v1.sql
      - name: Apply secure customer checkout schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261117_nortago_customer_checkout_secure_v1.sql
      - name: Apply customer reservation schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261117_nortago_customer_reservation_v1.sql
      - name: Apply reservation management schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261117_nortago_reservation_management_v1.sql
      - name: Apply NORTAGO Order-only scope lock
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261120_nortago_order_only_scope_lock_v1.sql
      - name: Replay NORTAGO Order-only scope lock (idempotency)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261120_nortago_order_only_scope_lock_v1.sql
      - name: Apply subscription plan snapshot migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261120_nortago_order_subscription_plan_snapshot_v1.sql
      - name: Replay subscription plan snapshot migration (idempotency)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261120_nortago_order_subscription_plan_snapshot_v1.sql
      - name: Apply customer checkout idempotency migration
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261120_nortago_customer_checkout_idempotency_v1.sql
      - name: Replay customer checkout idempotency migration (idempotency)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261120_nortago_customer_checkout_idempotency_v1.sql
      - name: Apply Order-only release scope guard
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261120_nortago_order_release_scope_guard_v1.sql
      - name: Replay Order-only release scope guard (idempotency)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261120_nortago_order_release_scope_guard_v1.sql
      - name: Apply Order-only release scope guard
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261120_nortago_order_release_scope_guard_v1.sql
      - name: Replay Order-only release scope guard (idempotency)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261120_nortago_order_release_scope_guard_v1.sql
      - name: Run subscription billing security smoke checks
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/tests/nortago_subscription_billing_smoke.sql
      - name: Run schema and transactional RPC smoke checks
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/tests/nortago_subscription_schema_smoke.sql
      - name: Run Order-only scope smoke checks
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/tests/nortago_order_scope_smoke.sql
      - name: Run customer checkout idempotency smoke checks
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d nortago_test -v ON_ERROR_STOP=1 -f supabase/tests/nortago_customer_checkout_idempotency_smoke.sql
